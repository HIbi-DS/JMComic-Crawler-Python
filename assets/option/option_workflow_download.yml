# ============================================================
# 【这是配置文件】
# 放到：assets/option/option_workflow_download.yml
#
# 一眼区分：本文件里没有 name: / on: / jobs: / steps:
#          只有 dir_rule: / client: / auth: / plugins:
# ============================================================
dir_rule:
  base_dir: ${JM_DOWNLOAD_DIR}          # 由工作流 env 提供，指向 runner 上的下载目录
  rule: Bd_Aauthor_Atitle_Pindex         # 根目录 / 作者 / 标题 / 章节序号
client:
  impl: api            # api=移动端（默认，不限 IP，兼容性好）；html=网页端（限 IP 地区但快）
  retry_times: 5       # 单次请求失败后的额外重试次数，失败域名会自动后置
  # 域名一般不用配，jmcomic 会自动获取可用域名。
  # 只有当默认域名在你网络下全都不通时，才打开下面这段自己写死几个：
  # domain:
  #   html:
  #     - 18comic.vip
  #     - 18comic.org
auth:
  # 大部分本子不登录也能下；少部分敏感题材、收藏夹、签到才需要。
  # 在仓库 Settings → Secrets and variables → Actions 里加 JM_USERNAME / JM_PASSWORD。
  # 没配时这两个值会是空，jmcomic 按"未登录"访问，不会报错。
  username: ${JM_USERNAME}
  password: ${JM_PASSWORD}
plugins:
  dependencies_strategy: failed-fast     # 插件缺依赖时直接报错并给出 pip 安装命令
  after_init:
    - plugin: usage_log                  # 实时打印 CPU / 内存占用，便于观察 runner 状态
      kwargs:
        interval: 0.5
        enable_warning: false
  after_album:                           # 整个本子下载完成后
    - plugin: send_qq_email              # 发邮件通知；EMAIL_* 没配齐时这个插件会跳过
      kwargs:
        msg_from: ${EMAIL_FROM}
        msg_to: ${EMAIL_TO}
        password: ${EMAIL_PASS}
        title: ${EMAIL_TITLE}
        content: ${EMAIL_CONTENT}
